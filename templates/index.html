<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ chatbot_name }}</title>
  <style>
    :root{--bg:#07111f;--panel:#0d1b2e;--panel2:#10243b;--text:#eef6ff;--muted:#9fb2c8;--accent:#72e0c1;--accent2:#8ca8ff;--border:rgba(255,255,255,.09)}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 15% 10%,#173b50 0,transparent 34%),radial-gradient(circle at 90% 90%,#172552 0,transparent 30%),var(--bg);color:var(--text);display:grid;place-items:center;padding:24px}
    .shell{width:min(980px,100%);height:min(820px,calc(100vh - 48px));display:grid;grid-template-rows:auto 1fr auto;background:rgba(13,27,46,.82);backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:28px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.35)}
    header{padding:22px 26px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px}
    .orb{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#06111b;font-weight:900}
    h1{font-size:18px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:3px}
    #chat{padding:24px;overflow:auto;display:flex;flex-direction:column;gap:16px}
    .msg{max-width:78%;padding:14px 16px;border-radius:18px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word}
    .bot{align-self:flex-start;background:var(--panel2);border:1px solid var(--border)} .user{align-self:flex-end;background:linear-gradient(135deg,#244d61,#314578)}
    .welcome{max-width:600px}.welcome strong{color:var(--accent)}
    form{padding:18px 22px;border-top:1px solid var(--border);display:flex;gap:10px;background:rgba(7,17,31,.45)}
    textarea{resize:none;flex:1;min-height:52px;max-height:130px;border:1px solid var(--border);border-radius:16px;background:#081625;color:var(--text);padding:14px;font:inherit;outline:none}
    textarea:focus{border-color:rgba(114,224,193,.5)} button{width:56px;border:0;border-radius:16px;background:var(--accent);color:#06111b;font-size:20px;font-weight:800;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}
    @media(max-width:650px){body{padding:0}.shell{height:100vh;border-radius:0}.msg{max-width:88%}}
  </style>
</head>
<body>
<div class="shell">
  <header><div class="orb">✦</div><div><h1>{{ chatbot_name }}</h1><div class="sub">Focused academic study assistant</div></div></header>
  <main id="chat">
    <div class="msg bot welcome"><strong>Welcome.</strong> Ask me a study-related question in my subject area, and I’ll help you understand it clearly.</div>
  </main>
  <form id="form">
    <textarea id="input" placeholder="Ask a study question..." aria-label="Message"></textarea>
    <button id="send" type="submit" aria-label="Send">↑</button>
  </form>
</div>
<script>
const chat=document.getElementById("chat"), form=document.getElementById("form"), input=document.getElementById("input"), send=document.getElementById("send");
function add(text, who){const el=document.createElement("div");el.className=`msg ${who}`;el.textContent=text;chat.appendChild(el);chat.scrollTop=chat.scrollHeight;return el}
form.addEventListener("submit", async e=>{
  e.preventDefault(); const message=input.value.trim(); if(!message)return;
  add(message,"user"); input.value=""; send.disabled=true; const pending=add("Thinking…","bot");
  try{
    const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message})});
    const data=await r.json(); pending.textContent=data.answer||data.error||"Something went wrong.";
  }catch{pending.textContent="Unable to reach the server. Please try again."}
  finally{send.disabled=false;input.focus()}
});
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
</script>
</body>
</html>
